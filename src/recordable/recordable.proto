syntax = "proto3";

package warpspeed.recordable;

import "src/recordable/scheduling/scheduling.proto";
import "src/recordable/side_effects.proto";
import "src/recordable/syscall/syscall.proto";

// Top level messages are broken up roughly by if they would be self-contained
// in a module.

// Trace is the top level message. It contains a target and a list of events.
message Trace {
  message Target {
    string path = 1;
    repeated string arguments = 2;
    repeated string environment = 3;
  }

  message SharedFile {
    uint64 id = 1;
    string path = 2;
    uint64 device = 3;
    uint64 inode = 4;
    uint64 size = 5;
    bytes initial_contents = 6;
  }

  Target target = 1;
  repeated LogEvent events = 2;
  repeated SharedFile shared_files = 3;
}

// The current thread's time slice ran out at an instruction that isn't a syscall. The next event
// is the switch to another thread.
message Preemption {
  // Guest instructions retired since the previous event, as appbox counts them: an upper bound,
  // exact but for host interrupts meanwhile, which only add.
  uint64 instructions = 1;
  // The thread's registers where it was preempted.
  warpspeed.recordable.scheduling.Registers registers = 2;
  // What appbox did to guest memory while switching threads (e.g. delivering kevents).
  warpspeed.recordable.SideEffects side_effects = 3;
}

// The guest replaced its image, as with execve().
message Exec {
  string path = 1;
  repeated string argv = 2;
  repeated string envp = 3;
}

// LogEvent is a single event in the trace.
// It contains a program counter and a union of all possible events.
message LogEvent {
  uint64 pc = 1;
  repeated uint64 register_state = 2;
  // The guest thread the event happened on (appbox's thread ID).
  uint32 tid = 3;
  oneof event {
    warpspeed.recordable.syscall.Syscall syscall = 10;
    warpspeed.recordable.scheduling.Scheduling scheduling = 12;
    Exec exec = 13;
    Preemption preemption = 14;
  }
}
