syntax = "proto3";

package warpspeed.recordable.syscall;

import "src/recordable/side_effects.proto";

// A syscall recordable denotes the execution of a BSD syscall, mach trap, or
// platform specific syscall.
// Basically anything that is SVC'd into.
message Syscall {
  message SharedMap {
    uint64 shared_file_id = 1;
    uint64 file_offset = 2;
    uint64 map_length = 3;
    int32 recorded_fd = 4;
  }

  uint64 syscall_number = 1;
  warpspeed.recordable.SideEffects side_effects = 2;
  SharedMap shared_map = 3;
  // The thread left the vCPU in this syscall (blocked, yielded, parked or exited), so the next
  // event is the switch to another thread, and the syscall's results come with the switch back.
  // side_effects then only has memory written meanwhile on other threads' behalf.
  bool descheduled = 4;
}
